<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>星落之夜 v2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <div id="scene-bg"></div>
    <div id="hud-area"></div>
    <div id="dialog-area">
      <div class="startup-screen" id="startup-screen">
        <div class="startup-title">✦ 星落之夜 ✦</div>
        <div class="startup-subtitle">— 星辰之约 —</div>
        <button class="startup-btn" id="start-btn">开始游戏</button>
        <div class="startup-hint">或按任意键继续</div>
      </div>
    </div>
    <div id="phone-area"></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "./engine/calendar.js": "./engine/calendar.js",
      "./engine/save.js": "./engine/save.js",
      "./engine/state.js": "./engine/state.js",
      "./engine/relationship.js": "./engine/relationship.js",
      "./engine/dialogue.js": "./engine/dialogue.js",
      "./lib/eventbus.js": "./lib/eventbus.js",
      "./lib/idb.js": "./lib/idb.js",
      "./systems/economy.js": "./systems/economy.js",
      "./systems/achievements.js": "./systems/achievements.js",
      "./ui/dialog.js": "./ui/dialog.js",
      "./ui/hud.js": "./ui/hud.js",
      "./ui/phone.js": "./ui/phone.js",
      "./data/scenes.js": "./data/scenes.js",
      "./data/achievements.js": "./data/achievements.js",
      "./data/items.js": "./data/items.js",
      "./data/constants.js": "./data/constants.js"
    }
  }
  </script>
  <script type="module">
    import { Game } from './game.js';

    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', start);
    document.addEventListener('keydown', () => start(), { once: true });

    let started = false;
    async function start() {
      if (started) return;
      started = true;

      // Fade out startup screen
      const screen = document.getElementById('startup-screen');
      if (screen) {
        screen.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        screen.style.opacity = '0';
        screen.style.transform = 'scale(0.98)';
        await new Promise(r => setTimeout(r, 400));
        screen.remove();
      }

      const container = document.getElementById('game-container');
      const game = new Game(container);
      window.__game = game;
      await game.init();
    }
  </script>
</body>
</html>
